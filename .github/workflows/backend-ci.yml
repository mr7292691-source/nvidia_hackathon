name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports

      - name: Run tests
        env:
          NVIDIA_API_KEY: ci-placeholder-key
          DATABASE_URL: sqlite+aiosqlite:///./var/ci-test.db
          NEMO_RELAY_ATOF_OUTPUT_DIR: ./var/ci-atof
        run: pytest tests/ -v

      - name: Verify app boots (lifespan: init_db + init_relay + register_all_guardrails)
        env:
          NVIDIA_API_KEY: ci-placeholder-key
          DATABASE_URL: sqlite+aiosqlite:///./var/ci-boot.db
          NEMO_RELAY_ATOF_OUTPUT_DIR: ./var/ci-atof-boot
        run: |
          python -c "
          import asyncio
          from app.main import app

          async def main():
              async with app.router.lifespan_context(app):
                  print('App booted successfully')

          asyncio.run(main())
          "

  # Note: this pipeline cannot exercise anything that requires a live
  # build.nvidia.com call or a reachable OpenShell cluster -- those remain
  # manual verification steps once the team has real infrastructure access
  # (see docs/plan.md Phase 1/7). CI here proves everything that doesn't
  # need that: persistence, gate logic, Relay wiring, graph construction,
  # and app startup.
