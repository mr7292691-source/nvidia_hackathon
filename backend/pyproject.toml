[project]
name = "lifeshield-backend"
version = "0.1.0"
description = "LifeShield AI — multi-agent disaster response backend (NVIDIA GSI Open Hackathon)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",           # swap for postgres in prod via DATABASE_URL

    # LangChain / DeepAgents / OpenShell orchestration
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "deepagents",                 # https://github.com/langchain-ai/deepagents
    "langchain-nvidia-ai-endpoints>=0.3",  # NVIDIA NIM chat/embeddings client

    # NVIDIA NeMo Relay (Python binding) — governance/observability runtime
    "nemo-relay",                  # https://github.com/NVIDIA/NeMo-Relay

    # NOTE: NVIDIA-NeMo/Switchyard runs as a sidecar proxy (switchyard-server),
    # not a Python import — see infra/switchyard/. The backend only needs an
    # OpenAI-compatible HTTP client (httpx) to talk to it.

    # NOTE: OpenShell sandbox runtime is invoked via the openshell-deepagent
    # pattern (CLI/SDK, pinned once the team vendors it) — see
    # app/agents/openshell_sandbox.py for the integration seam.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
