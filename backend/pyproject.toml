[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeshield-backend"
version = "0.1.0"
description = "LifeShield AI -- multi-agent disaster response backend (NVIDIA GSI Open Hackathon)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",

    # Real NVIDIA / LangChain stack -- versions below are pinned to what was
    # actually installed and verified working together in this environment
    # (see docs/plan.md for what was tested vs. what still needs a live
    # NVIDIA endpoint to verify).
    "langchain-core==1.6.1",
    "langchain==1.3.18",
    "langgraph==1.2.11",
    "deepagents==0.7.13",
    "langchain-nvidia-ai-endpoints==1.4.3",
    "nemo-relay==0.8.3",
    "openshell==0.0.116",
    "nemo-switchyard==0.2.0",  # provides the `switchyard` CLI, see infra/slurm/switchyard.sbatch
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Base pyflakes + pycodestyle-error set, plus import sorting. Explicitly
# NOT enabling DTZ (datetime-timezone-awareness) project-wide: this
# codebase consistently uses naive UTC datetimes throughout (evidence
# timestamps, event windows, DB columns) as a deliberate, uniform choice
# for the hackathon demo -- enforcing tz-aware datetimes would mean
# touching every timestamp in the evidence/persistence layer for a
# style preference, not a bug. Revisit if this moves past demo scope.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
# Real error hit on Curiosity v2: setuptools' flat-layout auto-discovery
# found `infra/` (Slurm scripts, YAML, markdown -- not Python code) as an
# ambiguous second "top-level package" alongside `app/`, and refused to
# build rather than guess. `app*` restricts discovery to the actual
# Python package tree (app, app.core, app.agents, ...), excluding infra/,
# tests/, scripts/, docs/, var/ entirely.
include = ["app*"]
