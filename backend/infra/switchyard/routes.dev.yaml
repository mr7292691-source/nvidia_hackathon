# NVIDIA-NeMo/Switchyard routing-profile bundle — DEV environment.
#
# This is the REAL config schema for the installed `nemo-switchyard` 0.2.0
# package (`pip install nemo-switchyard`, CLI entrypoint `switchyard`).
# Verified locally: `switchyard serve --routing-profiles routes.dev.yaml`
# starts a real OpenAI-compatible proxy and serves /v1/models correctly
# with these two routes registered.
#
# NOTE: earlier drafts of this file used a `routes.toml` / `--config`
# format documented for a standalone `switchyard-server` Rust binary. The
# pip-distributed CLI actually installed uses this YAML "routing-profile
# bundle" schema instead (`switchyard serve --routing-profiles <file>`,
# `switchyard.cli.route_bundle` module). This file reflects what was
# actually verified to work, not what was documented elsewhere.
#
# Start it:
#   switchyard serve --routing-profiles infra/switchyard/routes.dev.yaml --port 4100
#
# `${NVIDIA_API_KEY}` is expanded from the environment at load time — never
# hardcode the key here.

defaults:
  base_url: https://integrate.api.nvidia.com/v1
  api_key: ${NVIDIA_API_KEY}
  format: openai

routes:
  # TODO: pin these against the LIVE catalog before use -- the catalog is
  # volatile (models get deprecated on short notice; confirmed as of this
  # writing that several models across NVIDIA's catalog are mid-deprecation).
  #
  # nvidia/nemotron-4-340b-instruct: unverified placeholder, this
  # sandbox's network policy blocked checking build.nvidia.com directly.
  #
  # nvidia/vila: CONFIRMED DEPRECATED (not just unverified) -- its own
  # build.nvidia.com page states "This NIM Endpoint has been deprecated.
  # Please transition to another model to avoid any service
  # interruptions." Do not use as-is. Check build.nvidia.com/explore/vision
  # for whatever vision-language model is current right now and replace
  # this before running anything against it.
  lifeshield-reasoning:
    model: nvidia/nemotron-4-340b-instruct
  lifeshield-vision:
    model: nvidia/vila
